# DigiByte Core — Mainnet Configuration for Solo Mining
#
# Place this file at: ~/.digibyte/digibyte.conf
# Then start the node: digibyted -daemon

# Enable RPC server (required for ckpool)
server=1

# RPC credentials — CHANGE THESE to random values
# Generate with: openssl rand -hex 16
rpcuser=your_rpc_username
rpcpassword=your_rpc_password_change_me

# RPC port (DigiByte mainnet default: 14022)
rpcport=14022

# RPC access control
# Option A: Local only (miner and ckpool on same machine)
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Option B: LAN access (uncomment if miner is on a different machine)
# rpcbind=0.0.0.0
# rpcallowip=192.168.0.0/16

# Performance tuning
dbcache=1024          # RAM for UTXO cache (MB) — more = faster sync
maxmempool=300        # Max mempool size (MB)

# Optional: prune if disk space is limited (keeps last N MB of blocks)
# prune=10000
